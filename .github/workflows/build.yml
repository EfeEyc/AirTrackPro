name: Build AirTrack Pro (iOS IPA + PC Bridge)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ios-ipa:
    name: Build Unsigned iOS IPA (SideStore)
    runs-on: xcode-27

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select latest Xcode 27 SDK
        run: |
          ls -d /Applications/Xcode*.app || true
          LATEST_XCODE=$(ls -d /Applications/Xcode_27*.app /Applications/Xcode.app 2>/dev/null | sort -V | tail -n 1 || true)
          if [ -n "$LATEST_XCODE" ] && [ -d "$LATEST_XCODE" ]; then
            echo "Selecting Xcode: $LATEST_XCODE"
            sudo xcode-select -s "$LATEST_XCODE/Contents/Developer"
          fi
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios/AirTrackPro
        run: xcodegen generate

      - name: Archive unsigned iOS app
        working-directory: ios/AirTrackPro
        run: |
          xcodebuild archive \
            -project AirTrackPro.xcodeproj \
            -scheme AirTrackPro \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -archivePath "$RUNNER_TEMP/AirTrackPro.xcarchive" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_ENTITLEMENTS=""

      - name: Verify Info.plist and package .ipa
        run: |
          APP_PATH="$RUNNER_TEMP/AirTrackPro.xcarchive/Products/Applications/AirTrackPro.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "ERROR: AirTrackPro.app not found at $APP_PATH"
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/ipa_stage/Payload"
          cp -R "$APP_PATH" "$RUNNER_TEMP/ipa_stage/Payload/"
          STAGE_APP="$RUNNER_TEMP/ipa_stage/Payload/AirTrackPro.app"

          echo "=== Compiled Info.plist ==="
          plutil -p "$STAGE_APP/Info.plist"
          plutil -extract DTSDKName raw "$STAGE_APP/Info.plist"
          plutil -extract NSMotionUsageDescription raw "$STAGE_APP/Info.plist"
          plutil -extract NSCameraUsageDescription raw "$STAGE_APP/Info.plist"
          plutil -extract NSLocalNetworkUsageDescription raw "$STAGE_APP/Info.plist"
          plutil -extract UIBackgroundModes.0 raw "$STAGE_APP/Info.plist"
          plutil -extract UISupportedInterfaceOrientations.3 raw "$STAGE_APP/Info.plist"

          codesign --force --sign - "$STAGE_APP"
          codesign -dv "$STAGE_APP"

          mkdir -p "$GITHUB_WORKSPACE/dist"
          cd "$RUNNER_TEMP/ipa_stage"
          zip -qry "$GITHUB_WORKSPACE/dist/AirTrackPro-unsigned.ipa" Payload
          ls -lh "$GITHUB_WORKSPACE/dist/AirTrackPro-unsigned.ipa"

      - name: Upload AirTrackPro-unsigned.ipa
        uses: actions/upload-artifact@v4
        with:
          name: AirTrackPro-iOS-IPA
          path: dist/AirTrackPro-unsigned.ipa

  build-pc-bridge:
    name: Build Windows PC Bridge
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish PC Bridge (win-x64)
        run: |
          dotnet publish pc/AirTrackBridge.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o dist/pc
          copy pc\start.bat dist\pc\start.bat

      - name: Upload PC Bridge artifact
        uses: actions/upload-artifact@v4
        with:
          name: AirTrackBridge-Windows-x64
          path: dist/pc/
